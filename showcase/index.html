<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JF Diseños 3D - Showcase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #050a18; font-family: 'Inter', sans-serif; color: #e2e8f0; overflow: hidden; }
    @keyframes logoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes logoPulse { 0%,100%{filter:drop-shadow(0 0 40px rgba(59,130,246,0.3))} 50%{filter:drop-shadow(0 0 60px rgba(59,130,246,0.5))} }
    @keyframes textGlow { 0%,100%{filter:drop-shadow(0 0 30px rgba(59,130,246,0.4))} 50%{filter:drop-shadow(0 0 50px rgba(59,130,246,0.7))} }
    #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 20; opacity: 0; transition: opacity 1.5s cubic-bezier(0.4,0,0.2,1); }
    #overlay.show { opacity: 1; }
    #overlayText { font-family: 'Space Grotesk', sans-serif; font-size: clamp(1.5rem,5vw,4rem); font-weight: 800; text-align: center; line-height: 1.2; padding: 0 2rem; background: linear-gradient(135deg, #fff 0%, #60a5fa 50%, #a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; filter: drop-shadow(0 0 30px rgba(59,130,246,0.4)); }
    #overlay.show #overlayText { animation: textGlow 3s ease-in-out infinite; }
    #shopBtn { display: inline-flex; align-items: center; gap: 0.6rem; margin-top: 2rem; font-family: 'Space Grotesk', sans-serif; font-size: clamp(0.85em,2vw,1.1em); font-weight: 600; color: #fff; text-decoration: none; letter-spacing: 0.08em; padding: 1.1em 2.8em; border-radius: 100px; background: linear-gradient(135deg, #2563eb, #8b5cf6); border: none; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 24px rgba(37,99,235,0.4), 0 0 0 1px rgba(59,130,246,0.3); opacity: 0; transform: translateY(20px); transition: all 0.5s cubic-bezier(0.4,0,0.2,1); }
    #shopBtn.show { opacity: 1; transform: translateY(0); }
    #shopBtn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 40px rgba(37,99,235,0.6), 0 0 0 1px rgba(59,130,246,0.5); }
    #startScreen { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 50% 40%, rgba(37,99,235,0.08) 0%, #050a18 60%); cursor: pointer; }
    #startScreen.hide { display: none; }
    .start-logo { width: clamp(80px,18vw,140px); height: clamp(80px,18vw,140px); margin-bottom: 2.5rem; animation: logoFloat 4s ease-in-out infinite; }
    .start-logo img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 40px rgba(59,130,246,0.3)); animation: logoPulse 3s ease-in-out infinite; }
    .start-brand { font-family: 'Space Grotesk', sans-serif; font-size: clamp(2rem,7vw,4.5rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; background: linear-gradient(135deg,#fff 0%,#60a5fa 50%,#a78bfa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; text-align: center; margin-bottom: 0.8rem; }
    .start-tagline { font-size: clamp(0.7rem,1.8vw,0.95rem); color: #64748b; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 400; margin-bottom: 3rem; }
    .start-cta { display: flex; align-items: center; gap: 0.75rem; padding: 1rem 2.5rem; border-radius: 100px; background: rgba(59,130,246,0.08); border: 1px solid rgba(59,130,246,0.25); color: #60a5fa; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; }
    .start-hint { position: absolute; bottom: 2.5rem; font-size: 0.7rem; color: #64748b; letter-spacing: 0.1em; opacity: 0.5; }
    .play-tri { width: 0; height: 0; border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-left: 10px solid #60a5fa; margin-left: 2px; }
    #ytPlayer { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  </style>
</head>
<body>
  <div id="startScreen">
    <div class="start-logo"><img src="../musica/logo-website.png" alt="JF Diseños 3D"></div>
    <div class="start-brand">JF DISEÑOS 3D</div>
    <div class="start-tagline">Impresión 3D & Diseño Personalizado</div>
    <div class="start-cta"><div class="play-tri"></div>EXPERIENCIA</div>
    <div class="start-hint">Hacé click para comenzar</div>
  </div>

  <div id="ytPlayer"></div>

  <div id="overlay">
    <div id="overlayText">DESCUBRÍ TU MUNDO<br>CREÁ TU DESTINO</div>
    <a id="shopBtn" href="https://www.tienda-simple.com.ar/tienda/jf-disenos-3d" target="_blank" rel="noopener noreferrer">IR A TIENDA <span style="font-size:1.2em">→</span></a>
  </div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var TARGET_SECONDS = 91;
    var overlayShown = false;
    var checkInterval;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        videoId: 'clPKGk9LuRE',
        playerVars: {
          'autoplay': 0,
          'controls': 0,
          'disablekb': 1,
          'modestbranding': 1,
          'rel': 0,
          'showinfo': 0,
          'fs': 0,
          'iv_load_policy': 3,
          'playsinline': 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
    }

    function onPlayerReady(event) {
      document.getElementById('startScreen').addEventListener('click', function() {
        this.classList.add('hide');
        player.playVideo();
        checkInterval = setInterval(checkTime, 500);
      });
    }

    function onPlayerStateChange(event) {
      if (event.data === YT.PlayerState.ENDED && !overlayShown) {
        showOverlay();
      }
    }

    function checkTime() {
      if (!player || !player.getCurrentTime) return;
      var currentTime = player.getCurrentTime();
      if (currentTime >= TARGET_SECONDS && !overlayShown) {
        showOverlay();
      }
    }

    function showOverlay() {
      overlayShown = true;
      clearInterval(checkInterval);
      document.getElementById('overlay').classList.add('show');
      setTimeout(function() {
        document.getElementById('shopBtn').classList.add('show');
      }, 1500);
    }
  </script>
</body>
</html>
